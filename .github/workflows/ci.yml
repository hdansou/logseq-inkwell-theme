name: CI

on:
  push:
    branches: [main]
  pull_request:

# Third-party actions are pinned to commit SHAs (version in the comment).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Fails when a variant breaks the contract or themes/ / package.json are stale against src/.
      - run: npm test
