name: Publish

# Push a tag like v0.1.0 (matching package.json "version") to build the marketplace zip
# and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

# Third-party actions are pinned to commit SHAs (version in the comment).
permissions:
  contents: write # create the release and upload the zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Tag matches package.json version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || { echo "tag ${GITHUB_REF_NAME} != v${VERSION}"; exit 1; }
      - name: Build zip (runs the tests first)
        id: pack
        run: echo "zip=$(sh tools/package.sh)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ steps.pack.outputs.zip }}
          generate_release_notes: true
