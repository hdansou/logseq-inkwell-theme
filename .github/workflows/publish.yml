name: Publish

# Push a tag like v1.0.0 (matching package.json "version") to build the marketplace zip
# and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

# Third-party actions are pinned to commit SHAs (version in the comment).
permissions:
  contents: write # create the release and upload the zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Tag matches package.json version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || { echo "tag ${GITHUB_REF_NAME} != v${VERSION}"; exit 1; }
      - name: Build zip (runs the tests first)
        id: pack
        run: echo "zip=$(sh tools/package.sh)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.pack.outputs.zip }}
          generate_release_notes: true
